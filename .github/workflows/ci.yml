name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: |
            go.sum
            contracts/go.sum

      - name: Install protoc and Task
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          go install github.com/go-task/task/v3/cmd/task@v3.54.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install protoc plugins
        run: task proto:tools

      - name: Verify generated proto
        run: task proto:check

      - name: Unit tests
        run: go test ./... -count=1

      - name: Build agent
        run: go build -o /dev/null ./cmd/agent

      - name: Build image
        run: AGENT_IMAGE=mytonprovider-agent:ci task image:build
