name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache-dependency-path: |
            go.sum
            contracts/go.sum

      - name: Install protoc and Task
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          go install github.com/go-task/task/v3/cmd/task@v3.54.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install protoc plugins
        run: task proto:tools

      - name: Verify generated proto
        run: task proto:check

      - name: Unit tests
        run: go test ./... -count=1

      - name: Build agent
        run: go build -o /dev/null ./cmd/agent

      # On push to master the publish job builds the image.
      - name: Build image
        if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/master') }}
        run: AGENT_IMAGE=mytonprovider-agent:ci task image:build

  publish:
    needs: check
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set image
        run: echo "IMAGE=ghcr.io/${{ github.repository }}:${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          docker build --platform linux/amd64 -t "$IMAGE" .
          docker push "$IMAGE"
