version: "3"

tasks:
  proto:tools:
    desc: Install protobuf Go generators
    cmds:
      - go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
      - go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.1

  proto:gen:
    desc: Generate Go code from shared proto contracts
    cmds:
      - mkdir -p contracts/gen/go
      - protoc -I contracts/proto --go_out=contracts/gen/go --go_opt=paths=source_relative --go-grpc_out=contracts/gen/go --go-grpc_opt=paths=source_relative providerchecks/v1/provider_checks.proto

  proto:check:
    desc: Verify generated proto code is up to date
    cmds:
      - task proto:gen
      - git diff --exit-code -- contracts/gen/go

  postman:run:
    desc: Run Postman collection for agent gRPC
    cmds:
      - mkdir -p tests/postman/reports
      - |
        if ! command -v postman >/dev/null 2>&1 || ! postman collection run --help >/dev/null 2>&1; then
          echo "Postman CLI is not installed (or desktop postman is used). Install CLI: https://learning.postman.com/docs/postman-cli/postman-cli-installation/"
          exit 1
        fi
      - |
        postman collection run \
          "tests/postman/agent-grpc.postman_collection.json" \
          --environment "tests/postman/agent-local.postman_environment.json" \
          --reporters cli,json \
          --reporter-json-export "tests/postman/reports/postman-report.json" \
          ${POSTMAN_CA_CERT:+--ssl-extra-ca-certs "$POSTMAN_CA_CERT"} \
          --verbose

  certs:test:
    desc: Generate local self-signed certs for agent tests
    cmds:
      - mkdir -p tests/certs
      - |
        openssl req -x509 -newkey rsa:2048 -sha256 -nodes \
          -keyout tests/certs/server.key \
          -out tests/certs/server.crt \
          -days 365 \
          -subj "/CN=127.0.0.1" \
          -addext "subjectAltName=IP:127.0.0.1"

  run:test:
    desc: Run agent locally with test env and local certs
    deps:
      - certs:test
    cmds:
      - |
        AGENT_LISTEN_ADDR=:8443 \
        AGENT_ID=test-agent \
        AGENT_LOCATION=local \
        AGENT_AUTH_TOKEN=test-token \
        AGENT_TLS_CERT_FILE=tests/certs/server.crt \
        AGENT_TLS_KEY_FILE=tests/certs/server.key \
        AGENT_MAX_CONCURRENT_PROVIDERS=40 \
        AGENT_ADNL_PORT=36167 \
        AGENT_METRICS_LISTEN_ADDR=0.0.0.0:9090 \
        AGENT_LOKI_URL=http://127.0.0.1:3100 \
        go run ./cmd/agent

  test:smoke:
    desc: Run grpcurl smoke checks against already running test agent
    cmds:
      - |
        if ! command -v grpcurl >/dev/null 2>&1; then
          echo "grpcurl is required. Install: https://github.com/fullstorydev/grpcurl#installation"
          exit 1
        fi
      - |
        set -euo pipefail
        echo "Expecting running agent on 127.0.0.1:8443 (start separately with: task run:test)"

        echo "=== CASE 1: valid token + valid payload ==="
        VALID_OUT="$(grpcurl -insecure -import-path contracts/proto -proto providerchecks/v1/provider_checks.proto -H "authorization: Bearer test-token" -d @ 127.0.0.1:8443 providerchecks.v1.ProviderChecksService/RunChecks < tests/grpc/runchecks-valid.json)"
        echo "$VALID_OUT"
        if echo "$VALID_OUT" | rg -q '"jobId": "smoke-valid-1"' && echo "$VALID_OUT" | rg -q '"results":'; then
          echo "PASS: valid request returned response with results"
        else
          echo "FAIL: valid request output mismatch"
          exit 1
        fi

        echo "=== CASE 2: invalid token ==="
        set +e
        BAD_TOKEN_OUT="$(grpcurl -insecure -import-path contracts/proto -proto providerchecks/v1/provider_checks.proto -H "authorization: Bearer bad-token" -d @ 127.0.0.1:8443 providerchecks.v1.ProviderChecksService/RunChecks < tests/grpc/runchecks-invalid-token.json 2>&1)"
        BAD_TOKEN_CODE=$?
        set -e
        echo "$BAD_TOKEN_OUT"
        if [ $BAD_TOKEN_CODE -ne 0 ] && echo "$BAD_TOKEN_OUT" | rg -q 'Code: Unauthenticated'; then
          echo "PASS: invalid token rejected with Unauthenticated"
        else
          echo "FAIL: invalid token case mismatch"
          exit 1
        fi

        echo "=== CASE 3: invalid payload ==="
        set +e
        BAD_PAYLOAD_OUT="$(grpcurl -insecure -import-path contracts/proto -proto providerchecks/v1/provider_checks.proto -H "authorization: Bearer test-token" -d @ 127.0.0.1:8443 providerchecks.v1.ProviderChecksService/RunChecks < tests/grpc/runchecks-invalid-payload.json 2>&1)"
        BAD_PAYLOAD_CODE=$?
        set -e
        echo "$BAD_PAYLOAD_OUT"
        if [ $BAD_PAYLOAD_CODE -ne 0 ] && echo "$BAD_PAYLOAD_OUT" | rg -q 'Code: InvalidArgument'; then
          echo "PASS: invalid payload rejected with InvalidArgument"
        else
          echo "FAIL: invalid payload case mismatch"
          exit 1
        fi

        echo "=== SUMMARY ==="
        echo "3/3 cases passed"

  test:live:storage-rates:replay:
    desc: Replay existing runchecks-live-storage-rates.json against running test agent (no new dump)
    cmds:
      - |
        set -euo pipefail
        if ! command -v grpcurl >/dev/null 2>&1; then
          echo "grpcurl is required. Install: https://github.com/fullstorydev/grpcurl#installation"
          exit 1
        fi
        RATES_REQ="tests/grpc/runchecks-live-storage-rates.json"
        if [[ ! -f "$RATES_REQ" ]]; then
          echo "$RATES_REQ not found. Dump it in https://github.com/mytonprovider/mytonprovider-backend, see tests/grpc/README.md"
          exit 1
        fi
        mkdir -p tests/grpc/reports
        LAST_JSON="tests/grpc/reports/runchecks-storage-rates-last.json"
        grpcurl -insecure \
          -import-path contracts/proto \
          -proto providerchecks/v1/provider_checks.proto \
          -H "authorization: Bearer test-token" \
          -d @ \
          127.0.0.1:8443 \
          providerchecks.v1.ProviderChecksService/RunStorageRates \
          < "$RATES_REQ" | tee "$LAST_JSON"
        if command -v jq >/dev/null 2>&1; then
          TOTAL="$(jq '.results | length' "$LAST_JSON")"
          OK="$(jq '[.results[] | select(.ok == true)] | length' "$LAST_JSON")"
          NOT_OK=$((TOTAL - OK))
          echo ""
          echo "=== RunStorageRates summary (informational; network may fail rows) ==="
          echo "  ok rows:    $OK"
          echo "  fail rows:  $NOT_OK"
          echo "  total rows: $TOTAL"
        else
          echo ""
          echo "(Install jq to print row summary.)"
        fi

  test:live:replay:
    desc: Replay existing runchecks-live.json against running test agent (no new dump)
    cmds:
      - |
        set -euo pipefail
        if ! command -v grpcurl >/dev/null 2>&1; then
          echo "grpcurl is required. Install: https://github.com/fullstorydev/grpcurl#installation"
          exit 1
        fi
        if [[ ! -f tests/grpc/runchecks-live.json ]]; then
          echo "tests/grpc/runchecks-live.json not found. Dump it in https://github.com/mytonprovider/mytonprovider-backend, see tests/grpc/README.md"
          exit 1
        fi
        mkdir -p tests/grpc/reports
        LAST_JSON="tests/grpc/reports/runchecks-live-last.json"
        grpcurl -insecure \
          -import-path contracts/proto \
          -proto providerchecks/v1/provider_checks.proto \
          -H "authorization: Bearer test-token" \
          -d @ \
          127.0.0.1:8443 \
          providerchecks.v1.ProviderChecksService/RunChecks \
          < tests/grpc/runchecks-live.json | tee "$LAST_JSON"
        if command -v jq >/dev/null 2>&1; then
          TOTAL="$(jq '.results | length' "$LAST_JSON")"
          OK="$(jq '[.results[] | select(.reasonCode == "VALID_STORAGE_PROOF" or .reasonCode == 1)] | length' "$LAST_JSON")"
          NOT_OK=$((TOTAL - OK))
          echo ""
          echo "=== RunChecks contract summary ==="
          echo "  valid (VALID_STORAGE_PROOF): $OK"
          echo "  other / failed:            $NOT_OK"
          echo "  total results:              $TOTAL"
          META_JSON="tests/grpc/runchecks-live-meta.json"
          if [[ ! -f "$META_JSON" ]]; then
            EMPTY_META="$(mktemp)"
            printf '%s\n' '{"providers":[]}' > "$EMPTY_META"
            META_JSON="$EMPTY_META"
          fi
          echo ""
          jq -r -f tests/grpc/runchecks-live-summary.jq --slurpfile META "$META_JSON" "$LAST_JSON"
        else
          echo ""
          echo "(Install jq to print contract pass/fail summary.)"
        fi

  deploy:init:
    desc: Prepare agent deploy env and secrets placeholders
    cmds:
      - mkdir -p deploy/secrets
      - |
        if [ ! -f deploy/.env ]; then
          cp deploy/.env.example deploy/.env
          echo "Created deploy/.env from .env.example"
        else
          echo "deploy/.env already exists"
        fi
      - |
        if [ ! -f deploy/secrets/server.crt ]; then
          echo "Place TLS cert into deploy/secrets/server.crt"
        fi
      - |
        if [ ! -f deploy/secrets/server.key ]; then
          echo "Place TLS key into deploy/secrets/server.key"
        fi

  deploy:up:
    desc: Build and start agent deploy stack
    cmds:
      - docker compose --env-file deploy/.env -f deploy/docker-compose.yml up -d --build

  deploy:down:
    desc: Stop agent deploy stack
    cmds:
      - docker compose --env-file deploy/.env -f deploy/docker-compose.yml down

  deploy:ps:
    desc: Show agent deploy stack containers
    cmds:
      - docker compose --env-file deploy/.env -f deploy/docker-compose.yml ps

  deploy:logs:
    desc: Follow logs for agent deploy stack
    cmds:
      - docker compose --env-file deploy/.env -f deploy/docker-compose.yml logs -f

  hub:init:
    desc: Prepare agent hub deploy env and secrets placeholders
    cmds:
      - mkdir -p deploy/secrets
      - |
        if [ ! -f deploy/.env.hub ]; then
          cp deploy/.env.hub.example deploy/.env.hub
          echo "Created deploy/.env.hub from .env.hub.example"
        else
          echo "deploy/.env.hub already exists"
        fi
      - |
        if [ ! -f deploy/secrets/server.crt ]; then
          echo "Place TLS cert into deploy/secrets/server.crt"
        fi
      - |
        if [ ! -f deploy/secrets/server.key ]; then
          echo "Place TLS key into deploy/secrets/server.key"
        fi

  hub:up:
    desc: Pull and start agent from registry image (no local build)
    cmds:
      - docker compose --env-file deploy/.env.hub -f deploy/docker-compose.hub.yml up -d

  hub:down:
    desc: Stop hub agent stack
    cmds:
      - docker compose --env-file deploy/.env.hub -f deploy/docker-compose.hub.yml down

  hub:ps:
    desc: Show hub agent stack containers
    cmds:
      - docker compose --env-file deploy/.env.hub -f deploy/docker-compose.hub.yml ps

  hub:logs:
    desc: Follow logs for hub agent stack
    cmds:
      - docker compose --env-file deploy/.env.hub -f deploy/docker-compose.hub.yml logs -f

  hub:runchecks:
    desc: Summarize RunChecks completed lines from agent container logs (hub or hub.stack)
    cmds:
      - |
        set -euo pipefail
        if ! command -v python3 >/dev/null 2>&1; then
          echo "python3 is required"
          exit 1
        fi
        CID="$(docker compose --env-file deploy/.env.hub -f deploy/docker-compose.hub.yml ps -q agent 2>/dev/null || true)"
        if [ -z "${CID}" ]; then
          CID="$(docker compose --env-file deploy/.env.hub -f deploy/docker-compose.hub.stack.yml ps -q agent 2>/dev/null || true)"
        fi
        if [ -z "${CID}" ]; then
          echo "No running agent container (tried docker-compose.hub.yml and docker-compose.hub.stack.yml)"
          exit 1
        fi
        docker logs "${CID}" 2>&1 \
          | (grep 'RunChecks completed' || true) \
          | python3 -c '
        import sys, json
        for line in sys.stdin:
            o = json.loads(line)
            rc = o.get("reason_counts") or {}
            print(
                o.get("time"),
                o.get("job_id"),
                "valid=%s" % rc.get("VALID_STORAGE_PROOF", 0),
                "ping=%s" % rc.get("PING_FAILED", 0),
                "piece=%s" % rc.get("CANT_GET_PIECE", 0),
                "unavail=%s" % rc.get("UNAVAILABLE_PROVIDER", 0),
                "dur_ms=%s" % o.get("duration_ms"),
            )
        '

  hub:stack:up:
    desc: Pull and start agent + monitoring stack from registry image (no local build)
    cmds:
      - docker compose --env-file deploy/.env.hub -f deploy/docker-compose.hub.stack.yml up -d

  hub:stack:down:
    desc: Stop hub agent + monitoring stack
    cmds:
      - docker compose --env-file deploy/.env.hub -f deploy/docker-compose.hub.stack.yml down

  hub:stack:ps:
    desc: Show hub agent + monitoring stack containers
    cmds:
      - docker compose --env-file deploy/.env.hub -f deploy/docker-compose.hub.stack.yml ps

  hub:stack:logs:
    desc: Follow logs for hub agent + monitoring stack
    cmds:
      - docker compose --env-file deploy/.env.hub -f deploy/docker-compose.hub.stack.yml logs -f

  image:build:
    desc: Build agent image locally (set AGENT_IMAGE)
    cmds:
      - |
        if [ -z "${AGENT_IMAGE:-}" ]; then
          echo "AGENT_IMAGE is required, e.g. AGENT_IMAGE=ghcr.io/mytonprovider/mytonprovider-agent:<tag> task image:build"
          exit 1
        fi
      - docker build --platform linux/amd64 -f Dockerfile -t "${AGENT_IMAGE}" .

  image:push:
    desc: Push prebuilt agent image (set AGENT_IMAGE)
    cmds:
      - |
        if [ -z "${AGENT_IMAGE:-}" ]; then
          echo "AGENT_IMAGE is required, e.g. AGENT_IMAGE=ghcr.io/mytonprovider/mytonprovider-agent:<tag> task image:push"
          exit 1
        fi
      - docker push "${AGENT_IMAGE}"

  image:build:push:
    desc: Build and push agent image (set AGENT_IMAGE)
    cmds:
      - task: image:build
      - task: image:push
